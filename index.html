<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUCCI DRUM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1 class="title">GUCCI DRUM</h1>
        </header>

        <section class="controls">
            <div class="control-group">
                <label for="bpm">BPM</label>
                <input type="number" id="bpm" value="120" min="40" max="280">
            </div>
            <button id="play-stop">Play</button>
            <button id="restart">Restart</button>
            <div class="control-group">
                <label for="swing">Swing</label>
                <input type="range" id="swing" value="50" min="50" max="77">
                <span id="swing-value">50%</span>
            </div>
            <div class="control-group">
                <label for="drive">Drive</label>
                <input type="range" id="drive" value="0" min="0" max="100">
            </div>
        </section>

        <main class="main-content">
            <section class="patterns-container">
                <!-- 7 horizontal patterns will be generated here by JS -->
            </section>
            <section class="synth-settings-container">
                <div class="instrument-selectors">
                    <button class="selector-btn active" data-instrument="kick">Kick</button>
                    <button class="selector-btn" data-instrument="snare">Snare</button>
                    <button class="selector-btn" data-instrument="hat">Hat</button>
                    <button class="selector-btn" data-instrument="clap">Clap</button>
                    <button class="selector-btn" data-instrument="tom">Tom</button>
                    <button class="selector-btn" data-instrument="synth">Synth</button>
                </div>
                <div class="settings-panels">
                    <div class="settings-panel active" id="kick-settings">
                        <h3>Kick Settings</h3>
                        <div class="param-slider">
                            <label for="kick-decay">Decay</label>
                            <input type="range" id="kick-decay" min="0.1" max="1.5" step="0.01" value="0.5">
                        </div>
                        <div class="param-slider">
                            <label for="kick-start-pitch">Start Pitch</label>
                            <input type="range" id="kick-start-pitch" min="100" max="400" step="1" value="150">
                        </div>
                        <div class="param-slider">
                            <label for="kick-end-pitch">End Pitch</label>
                            <input type="range" id="kick-end-pitch" min="20" max="100" step="1" value="40">
                        </div>
                        <div class="param-slider">
                            <label for="kick-fm-amount">FM Amount</label>
                            <input type="range" id="kick-fm-amount" min="0" max="1000" step="1" value="250">
                        </div>
                    </div>
                    <div class="settings-panel" id="snare-settings">
                        <h3>Snare Settings</h3>
                        <div class="param-slider">
                            <label for="snare-tone-decay">Tone Decay</label>
                            <input type="range" id="snare-tone-decay" min="0.01" max="0.3" step="0.01" value="0.1">
                        </div>
                        <div class="param-slider">
                            <label for="snare-noise-decay">Noise Decay</label>
                            <input type="range" id="snare-noise-decay" min="0.01" max="0.5" step="0.01" value="0.2">
                        </div>
                        <div class="param-slider">
                            <label for="snare-noise-filter">Noise Filter</label>
                            <input type="range" id="snare-noise-filter" min="500" max="5000" step="10" value="1500">
                        </div>
                        <div class="param-slider">
                            <label for="snare-balance">Tone/Noise Balance</label>
                            <input type="range" id="snare-balance" min="0" max="1" step="0.01" value="0.5">
                        </div>
                    </div>
                    <div class="settings-panel" id="hat-settings">
                        <h3>Hat Settings</h3>
                        <div class="param-slider">
                            <label for="hat-closed-decay">Closed Decay</label>
                            <input type="range" id="hat-closed-decay" min="0.01" max="0.2" step="0.01" value="0.05">
                        </div>
                        <div class="param-slider">
                            <label for="hat-open-decay">Open Decay</label>
                            <input type="range" id="hat-open-decay" min="0.1" max="1.0" step="0.01" value="0.4">
                        </div>
                        <div class="param-slider">
                            <label for="hat-filter-freq">Filter Freq</label>
                            <input type="range" id="hat-filter-freq" min="3000" max="12000" step="100" value="7000">
                        </div>
                    </div>
                    <div class="settings-panel" id="clap-settings">
                        <h3>Clap Settings</h3>
                        <div class="param-slider">
                            <label for="clap-decay">Decay</label>
                            <input type="range" id="clap-decay" min="0.1" max="0.5" step="0.01" value="0.2">
                        </div>
                        <div class="param-slider">
                            <label for="clap-spread">Spread</label>
                            <input type="range" id="clap-spread" min="0.001" max="0.02" step="0.001" value="0.008">
                        </div>
                    </div>
                     <div class="settings-panel" id="tom-settings">
                        <h3>Tom Settings</h3>
                        <div class="param-slider">
                            <label for="tom-decay">Decay</label>
                            <input type="range" id="tom-decay" min="0.1" max="1.0" step="0.01" value="0.3">
                        </div>
                        <div class="param-slider">
                            <label for="tom-start-pitch">Start Pitch</label>
                            <input type="range" id="tom-start-pitch" min="200" max="800" step="1" value="400">
                        </div>
                        <div class="param-slider">
                            <label for="tom-end-pitch">End Pitch</label>
                            <input type="range" id="tom-end-pitch" min="100" max="400" step="1" value="200">
                        </div>
                    </div>
                    <div class="settings-panel" id="synth-settings">
                        <h3>Main Synthesizer</h3>
                        <div class="synth-global-controls">
                             <div class="param-slider">
                                <label for="synth-decay">Master Decay</label>
                                <input type="range" id="synth-decay" min="0.1" max="2.0" step="0.01" value="0.5">
                            </div>
                        </div>
                        <div class="synth-group">
                            <h4>Group 1</h4>
                            <div class="osc-column">
                                <h5>OSC 1</h5>
                                <div class="param-slider"><label>Pitch</label><input id="synth-osc1-pitch" type="range" min="-12" max="12" value="0"></div>
                            </div>
                            <div class="osc-column">
                                <h5>OSC 2</h5>
                                <div class="param-slider"><label>Pitch</label><input id="synth-osc2-pitch" type="range" min="-12" max="12" value="0"></div>
                                <div class="param-slider"><label>FM Depth</label><input id="synth-osc2-fmdepth" type="range" min="0" max="500" value="100"></div>
                            </div>
                            <div class="osc-column">
                                <h5>OSC 3</h5>
                                <div class="param-slider"><label>Pitch</label><input id="synth-osc3-pitch" type="range" min="-12" max="12" value="0"></div>
                                <div class="param-slider"><label>RM Depth</label><input id="synth-osc3-rmdepth" type="range" min="0" max="1" step="0.01" value="0.5"></div>
                            </div>
                        </div>
                        <div class="synth-group">
                            <h4>Group 2</h4>
                             <div class="osc-column">
                                <h5>OSC 4</h5>
                                <div class="param-slider"><label>Pitch</label><input id="synth-osc4-pitch" type="range" min="-12" max="12" value="0"></div>
                            </div>
                            <div class="osc-column">
                                <h5>OSC 5</h5>
                                <div class="param-slider"><label>Pitch</label><input id="synth-osc5-pitch" type="range" min="-12" max="12" value="0"></div>
                                <div class="param-slider"><label>FM Depth</label><input id="synth-osc5-fmdepth" type="range" min="0" max="500" value="100"></div>
                            </div>
                            <div class="osc-column">
                                <h5>OSC 6</h5>
                                <div class="param-slider"><label>Pitch</label><input id="synth-osc6-pitch" type="range" min="-12" max="12" value="0"></div>
                                <div class="param-slider"><label>RM Depth</label><input id="synth-osc6-rmdepth" type="range" min="0" max="1" step="0.01" value="0.5"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
