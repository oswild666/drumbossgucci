<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUCCI DRUM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1 class="title">GUCCI DRUM</h1>
        </header>

        <section class="controls">
            <div class="control-group">
                <label for="bpm">BPM</label>
                <input type="number" id="bpm" value="120" min="40" max="280">
            </div>
            <button id="play-stop">Play</button>
            <button id="restart">Restart</button>
            <div class="control-group">
                <label for="swing">Swing</label>
                <input type="range" id="swing" value="50" min="50" max="77">
                <span id="swing-value">50%</span>
            </div>
        </section>

        <main class="main-content">
            <section class="patterns-container">
                <!-- 7 horizontal patterns will be generated here by JS -->
            </section>
            <section class="synth-settings-container">
                <!-- Synth settings will be populated here -->
                <p>Synth Settings Panel</p>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
